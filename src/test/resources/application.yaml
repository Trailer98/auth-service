spring:
  datasource:
    url: jdbc:h2:mem:auth-service-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  cloud:
    nacos:
      discovery:
        enabled: false

auth:
  permission-cache-ttl: 30m
  jwt:
    issuer: auth-service
    secret: test-jwt-secret-at-least-32-bytes-long
    access-token-ttl: 15m
    refresh-token-ttl: 7d
