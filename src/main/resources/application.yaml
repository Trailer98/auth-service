server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo&useSSL=false&allowPublicKeyRetrieval=true
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${AUTH_REDIS_HOST:localhost}
      port: ${AUTH_REDIS_PORT:6379}
      database: ${AUTH_REDIS_DATABASE:0}
      password: ${AUTH_REDIS_PASSWORD:}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        service: ${spring.application.name}
        namespace: public
        group: DEFAULT_GROUP

auth:
  permission-cache-ttl: 30m
  jwt:
    issuer: auth-service
    secret: ${AUTH_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
